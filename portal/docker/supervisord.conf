# Included by the Debian supervisor package config (conf.d/portal.conf).
# Programs only — [supervisord]/[unix_http_server] come from the main file.
[program:portal]
command=/usr/local/bin/python /opt/portal/app.py
directory=/opt/portal
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/portal.log
stderr_logfile=/var/log/supervisor/portal.log

[program:smbd]
command=/usr/sbin/smbd --foreground --no-process-group
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/smbd.log
stderr_logfile=/var/log/supervisor/smbd.log
