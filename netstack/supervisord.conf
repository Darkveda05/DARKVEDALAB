# Included by the Debian supervisor package config (conf.d/netstack.conf).
# FRR control plane. Reachable ONLY on loopback (host netns) for the portal:
#   supervisorctl -s http://127.0.0.1:9001 restart zebra bgpd staticd
[inet_http_server]
port = 127.0.0.1:9001

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:mgmtd]
command=/usr/lib/frr/mgmtd -u frr -g frr
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/mgmtd.log
stderr_logfile=/var/log/supervisor/mgmtd.log

[program:zebra]
command=/usr/lib/frr/zebra -u frr -g frr
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/zebra.log
stderr_logfile=/var/log/supervisor/zebra.log

[program:bgpd]
command=/usr/lib/frr/bgpd -u frr -g frr
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/bgpd.log
stderr_logfile=/var/log/supervisor/bgpd.log

[program:staticd]
command=/usr/lib/frr/staticd -u frr -g frr
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/staticd.log
stderr_logfile=/var/log/supervisor/staticd.log
