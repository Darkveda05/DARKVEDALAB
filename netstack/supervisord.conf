# Included by the Debian supervisor package config (conf.d/netstack.conf).
# No persistent daemons: the entrypoint applies kernel state (WireGuard,
# iptables, br10) on every boot and exits leaving supervisord supervising
# nothing. Kept so host tooling (supervisorctl) still has an endpoint.
[inet_http_server]
port = 127.0.0.1:9001

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
